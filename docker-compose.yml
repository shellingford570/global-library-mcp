services:
  web:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['ok']"]
      interval: 10s
      timeout: 3s
      retries: 5
