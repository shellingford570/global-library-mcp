[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "global-library-mcp"
version = "1.0.0b11"
description = "Evidence-first MCP gateway for library and digital archive APIs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Global Library MCP contributors"}]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.6,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "respx>=0.21,<1",
]

[project.scripts]
global-library-mcp = "global_library_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/global_library_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"
