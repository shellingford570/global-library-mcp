name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install '.[test]'
      - run: pytest

  docker-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag global-library-mcp:${{ github.sha }} .
      - name: Start Docker container
        run: docker run --detach --name global-library-mcp --publish 8000:8000 global-library-mcp:${{ github.sha }}
      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs global-library-mcp
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E against Docker
        env:
          BASE_URL: http://127.0.0.1:8000
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      - name: Show container logs
        if: always()
        run: docker logs global-library-mcp || true
      - name: Stop Docker container
        if: always()
        run: docker rm --force global-library-mcp || true
