name: test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install '.[test]'
      - run: pytest

  workspace:
    # b7 final review section 29 (Job B) + b8 final review
    # section 18: the workspace-enabled regression. The server
    # runs the REAL stack (web server, WorkspaceApi,
    # LibraryService, adapters, BudgetedTransport, SQLite)
    # with only the upstream library HTTP fixed by recorded
    # fixtures (GLM_UPSTREAM_FIXTURE_DIR). A run where any
    # mandatory journey skips does NOT count as success: the
    # Playwright step asserts passed == 6 and skipped == 0.
    # Live-upstream browser checks are the separate,
    # non-blocking workspace-live job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install '.[test]'
      - name: Workspace pytest (storage, web API, final review, real-HTTP integration)
        run: pytest tests/test_b7_workspace.py tests/test_b7_web_api.py tests/test_b7_final_review.py tests/test_b7_http_integration.py tests/test_b8_workspace.py tests/test_b8_stage0.py tests/test_b8_final_review.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start workspace-enabled server (temp SQLite, fixed upstream fixtures)
        env:
          GLM_UPSTREAM_FIXTURE_DIR: ${{ github.workspace }}/tests/e2e/fixtures/upstream
        run: |
          mkdir -p /tmp/glm-ws-ci
          nohup global-library-mcp web --host 127.0.0.1 --port 8128 --workspace --workspace-path /tmp/glm-ws-ci/ws.db > /tmp/glm-ws-ci/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8128/health | grep -q '"ok": true'; then exit 0; fi
            sleep 2
          done
          cat /tmp/glm-ws-ci/server.log
          exit 1
      - name: Run workspace Playwright journeys
        env:
          BASE_URL: http://127.0.0.1:8128
        run: npx playwright test tests/e2e/workspace.spec.js --reporter=json > /tmp/glm-ws-ci/pw.json
      - name: Assert ALL mandatory workspace journeys ran (no skips)
        if: always()
        run: |
          python3 - <<'EOF'
          import json
          with open('/tmp/glm-ws-ci/pw.json') as fh:
              report = json.load(fh)
          stats = report.get('stats', {})
          passed = stats.get('expected', 0)
          skipped = stats.get('skipped', 0)
          print(f"workspace journeys: passed={passed} skipped={skipped} unexpected={stats.get('unexpected', 0)}")
          assert stats.get('unexpected', 0) == 0, "workspace journeys failed"
          assert skipped == 0, "a mandatory workspace journey skipped - not a CI success (section 18)"
          assert passed == 6, f"expected all 6 mandatory journeys to pass, got {passed}"
          EOF
      - name: Restart persistence check
        env:
          GLM_UPSTREAM_FIXTURE_DIR: ${{ github.workspace }}/tests/e2e/fixtures/upstream
        run: |
          pkill -f "global-library-mcp web" || true
          sleep 1
          test -f /tmp/glm-ws-ci/ws.db
          nohup global-library-mcp web --host 127.0.0.1 --port 8128 --workspace --workspace-path /tmp/glm-ws-ci/ws.db > /tmp/glm-ws-ci/server2.log 2>&1 &
          ok=""
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8128/health | grep -q '"ok": true'; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then cat /tmp/glm-ws-ci/server2.log; exit 1; fi
          curl --fail --silent http://127.0.0.1:8128/ | grep -q 'name="glm-workspace" content="1"'
      - name: Upload workspace Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-playwright-report
          path: |
            /tmp/glm-ws-ci/pw.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Show workspace server log
        if: always()
        run: cat /tmp/glm-ws-ci/server.log || true

  docker-playwright:
    # b10 final review section 3/35: MANDATORY Docker regression.
    # The image is built and run as the non-root appuser; the web
    # server, LibraryService, adapters and BudgetedTransport are
    # real, and ONLY the upstream library HTTP is fixed
    # (GLM_UPSTREAM_FIXTURE_DIR mounted read-only). The live
    # upstream smoke is the separate informational
    # docker-live-smoke job below - it is not part of this job
    # and its failures are never rewritten into successes here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag global-library-mcp:${{ github.sha }} .
      - name: Assert the image runs as a non-root user
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' global-library-mcp:${{ github.sha }})"
          echo "image user: $user"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"
      - name: Start Docker container (fixed upstream fixtures)
        run: >-
          docker run --detach --name global-library-mcp
          --publish 8000:8000
          --volume ${{ github.workspace }}/tests/e2e/fixtures/upstream:/fixtures:ro
          --env GLM_UPSTREAM_FIXTURE_DIR=/fixtures
          global-library-mcp:${{ github.sha }}
      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health | grep -q '"ok": true'; then exit 0; fi
            sleep 2
          done
          docker logs global-library-mcp
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E against Docker (fixed fixtures)
        env:
          BASE_URL: http://127.0.0.1:8000
        run: npx playwright test tests/e2e/search.spec.js --reporter=json > /tmp/docker-pw.json
      - name: Assert all 17 search journeys passed with no skips
        if: always()
        run: |
          python3 - <<'EOF'
          import json
          with open('/tmp/docker-pw.json') as fh:
              report = json.load(fh)
          stats = report.get('stats', {})
          passed = stats.get('expected', 0)
          skipped = stats.get('skipped', 0)
          print(f"docker search journeys: passed={passed} skipped={skipped} unexpected={stats.get('unexpected', 0)}")
          assert stats.get('unexpected', 0) == 0, "docker Playwright journeys failed"
          assert skipped == 0, "a mandatory journey skipped - not a CI success"
          assert passed == 17, f"expected all 17 search journeys to pass, got {passed}"
          EOF
      - name: Run fixture API smoke against Docker
        env:
          BASE_URL: http://127.0.0.1:8000
        run: tests/e2e_smoke_fixture.sh
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Show container logs
        if: always()
        run: docker logs global-library-mcp || true
      - name: Stop Docker container
        if: always()
        run: docker rm --force global-library-mcp || true

  docker-live-smoke:
    # b10 final review sections 3/35: INFORMATIONAL live-upstream
    # smoke, separated from the mandatory fixture regression.
    # Failures are preserved in the step log and the uploaded
    # result file with the failing stage and HTTP status; an
    # upstream failure (e.g. the NDL page API returning 500) is
    # reported as an upstream failure, never rewritten into a
    # normal response. This job does not gate the release.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag global-library-mcp:${{ github.sha }} .
      - name: Start Docker container (LIVE upstreams)
        run: docker run --detach --name global-library-mcp --publish 8000:8000 global-library-mcp:${{ github.sha }}
      - name: Wait for health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health | grep -q '"ok": true'; then exit 0; fi
            sleep 2
          done
          docker logs global-library-mcp
          exit 1
      - name: Run live API smoke against Docker (informational)
        env:
          BASE_URL: http://127.0.0.1:8000
        run: tests/e2e_smoke.sh 2>&1 | tee /tmp/live-smoke-result.txt
      - name: Upload live smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-live-smoke-result
          path: /tmp/live-smoke-result.txt
          if-no-files-found: warn
      - name: Stop Docker container
        if: always()
        run: docker rm --force global-library-mcp || true

  workspace-live:
    # b8 final review section 18: LIVE upstream browser checks,
    # separated from the mandatory fixture regression. This job
    # is informational only (continue-on-error): a live failure
    # or skip here never counts as fixed-regression success or
    # failure.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install '.[test]'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start workspace-enabled server (temp SQLite, LIVE upstreams)
        run: |
          mkdir -p /tmp/glm-ws-live
          nohup global-library-mcp web --host 127.0.0.1 --port 8129 --workspace --workspace-path /tmp/glm-ws-live/ws.db > /tmp/glm-ws-live/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8129/health | grep -q '"ok": true'; then exit 0; fi
            sleep 2
          done
          cat /tmp/glm-ws-live/server.log
          exit 1
      - name: Run live workspace journeys (informational)
        env:
          BASE_URL: http://127.0.0.1:8129
        run: npx playwright test tests/e2e/workspace-live.spec.js --reporter=list

  external-mcp:
    # b9 section 41: the external-research profile regression.
    # Real MCP server (FastMCP + SDK auth), real LibraryService
    # code paths against fake/fixture services, real external
    # rights policy, real token validation with a synthetic
    # HS256 test signer, real Streamable HTTP via uvicorn.
    # No live API, no real keys, no tunnel, no ChatGPT account.
    # Mandatory tests must not skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install '.[test]'
      - name: External MCP pytest (profile, ids, policy, auth, HTTP, isolation, real-path integration)
        run: pytest tests/test_b9_external.py tests/test_b9_http_security.py tests/test_b9_integration.py -q --junitxml=/tmp/b9-junit.xml
      - name: Assert no mandatory external test skipped
        if: always()
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/b9-junit.xml').getroot()
          suites = list(root.iter('testsuite'))
          tests = sum(int(s.get('tests', 0)) for s in suites)
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          failures = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites)
          print(f"external-mcp: tests={tests} skipped={skipped} failures={failures}")
          assert failures == 0, "external MCP tests failed"
          assert skipped == 0, "a mandatory external test skipped - not a CI success (section 41)"
          assert tests >= 40, f"expected the full external suite, got {tests}"
          EOF
      - name: Doctor (no network)
        run: |
          global-library-mcp doctor > /tmp/doctor.json || true
          python3 -c "import json; r=json.load(open('/tmp/doctor.json')); assert r['network_used'] is False; assert any(c['check']=='external_allowlist' and c['ok'] for c in r['checks'])"

  external-security:
    # b9 section 41: the fixed synthetic security evaluation
    # (164 cases in the final-review edition) and the
    # performance evaluation. The security script exits
    # non-zero on any failed case, including any non-zero
    # mandatory safety metric.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install '.[test]'
      - name: Security evaluation (164 synthetic cases)
        run: python eval/b9_security_eval.py --out /tmp/results-b9-security.json
      - name: Performance evaluation (synthetic)
        run: python eval/b9_perf.py --out /tmp/results-b9-perf.json
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b9-evaluation-results
          path: |
            /tmp/results-b9-security.json
            /tmp/results-b9-perf.json
          if-no-files-found: ignore

  research-validation:
    # b11: dataset integrity, grouped splits, NLI proxy harness,
    # evidence graph and synthesis - fixed fixtures only, no
    # model downloads, no live upstreams, no paid AI, no skips.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install '.[test]'
      - run: pytest tests/test_b11_stage0.py tests/test_b11_stage1.py tests/test_b11_stage2.py tests/test_b11_stage3.py tests/test_b11_stage4.py tests/test_b11_stage5.py tests/test_b11_stage6.py -q
      - run: python eval/b11_dataset.py --out /tmp/b11-cases-check.json
      - run: python eval/b11_grouped_splits.py --dataset /tmp/b11-cases-check.json --out /tmp/b11-splits-check.json
      - run: python eval/b11_nli_eval.py --out /tmp/b11-nli-check.json
